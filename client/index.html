<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大文件分片</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 20px;
            font-family: sans-serif;
        }

        button {
            margin-right: 10px;
            padding: 8px 12px;
        }

        progress {
            display: block;
            width: 100%;
            height: 20px;
            margin: 20px 0;
        }
    </style>
</head>

<body>

    <input type="file" id="fileInput">
    <br />
    <button id="toggleButton" onclick="toggleUpload()">暂停上传</button>
    <progress id="uploadProgress" value="0" max="100"></progress>

    <script src="./spark-md5.js"></script>
    <script src="./axios.js"></script>
    <script>
        const inputDom = document.getElementById("fileInput");
        const progressBar = document.getElementById("uploadProgress");
        const toggleButton = document.getElementById("toggleButton");

        let controller = {
            isPaused: false,
            abortList: [],
            file: null,
            hash: '',
            chunkArray: [],
            fileName: '',
            uploadedCountStart: 0
        };

        inputDom.onchange = async function () {
            controller.file = this.files[0];
            controller.fileName = controller.file.name;
            // 文件小于10MB不切片，直接上传
            if (controller.file.size <= 1024 * 1024 * 10) {
                const spark = new SparkMD5();
                spark.append(controller.file.name + controller.file.size); // 用文件名+大小模拟 hash
                const hash = spark.end();
                const { data: { code, msg, data } } = await axios.get(`/verify?hash=${hash}&fileName=${controller.fileName}`);
                if (code) {
                    alert(data);
                    return;
                }
                const formData = new FormData();
                formData.append("hash", hash);
                formData.append("file", controller.file);
                await axios.post("/upload/complete", formData, {
                    onUploadProgress(e) {
                        const percent = Math.round((e.loaded * 100) / e.total);
                        progressBar.value = percent;
                    }
                });
                return;
            }
            controller.chunkArray = await cutFile(controller.file);
            const str = controller.chunkArray.map(item => item.hash).toString();
            const spark = new SparkMD5();
            spark.append(str);
            controller.hash = spark.end();

            verifyAndUpload();
        };

        async function verifyAndUpload() {
            const { data: { code, msg, data } } = await axios.get(`/verify?hash=${controller.hash}&fileName=${controller.fileName}`);
            if (code) {
                alert(data);
                return;
            }
            controller.uploadedCountStart = data.length;
            const notUploaded = controller.chunkArray.filter(chunk => !data.includes(chunk.index + "-" + chunk.hash));
            if (notUploaded.length === 0) {
                await mergeChunk();
                return;
            }

            uploadChunks(notUploaded);
        }

        async function mergeChunk() {
            await axios.get(`/merge?hash=${controller.hash}&fileName=${controller.fileName}`);
            alert('上传完成并已合并！');
        }

        function uploadChunks(chunkArray) {
            const formDataList = chunkArray.map(chunk => {
                const formData = new FormData();
                formData.append("hash", controller.hash);
                formData.append("chunkName", `${chunk.index}-${chunk.hash}`);
                formData.append("chunk", chunk.blob);
                return formData;
            });
            concurrentUpload(formDataList, 3).then(async (res) => {
                if (res.length === formDataList.length) {
                    await mergeChunk();
                }
            });
        }

        function concurrentUpload(formDataList, limit = 3) {
            return new Promise((resolve, reject) => {
                if (formDataList.length === 0) return resolve([]);

                let result = [];
                let i = 0, finishCount = 0;

                async function upload() {
                    const index = i++;
                    const source = axios.CancelToken.source();
                    controller.abortList.push(source);

                    try {
                        const res = await axios.post("/upload", formDataList[index], {
                            cancelToken: source.token
                        });
                        result[index] = res;
                    } catch (e) {
                        if (axios.isCancel(e)) {
                            console.warn("上传已取消");
                            return;
                        } else {
                            reject(e);
                        }
                    } finally {
                        finishCount++;
                        const total = formDataList.length + controller.uploadedCountStart;
                        const current = controller.uploadedCountStart + finishCount;
                        progressBar.value = Math.round((current * 100) / total);

                        if (i < formDataList.length && !controller.isPaused) {
                            upload();
                        }

                        if (finishCount === formDataList.length) {
                            resolve(result);
                        }
                    }
                }

                for (let j = 0; j < limit && j < formDataList.length; j++) {
                    upload();
                }
            });
        }


        function toggleUpload() {
            if (controller.isPaused) {
                resumeUpload();
                toggleButton.textContent = "暂停上传";
            } else {
                pauseUpload();
                toggleButton.textContent = "恢复上传";
            }
        }

        function pauseUpload() {
            controller.isPaused = true;
            controller.abortList.forEach(source => source.cancel());
            controller.abortList = [];
        }

        function resumeUpload() {
            controller.isPaused = false;
            verifyAndUpload(); // 会自动续传未上传部分
        }

        function cutFile(file) {
            return new Promise((resolve) => {
                const CHUNK_SIZE = 1024 * 1024 * 10;
                const CHUNK_COUNT = Math.ceil(file.size / CHUNK_SIZE);
                const THREAD_COUNT = navigator.hardwareConcurrency || 4;
                const THREAD_CHUNK_COUNT = Math.ceil(CHUNK_COUNT / THREAD_COUNT);

                let result = [];
                let finishCount = 0;

                for (let i = 0; i < THREAD_COUNT && i < CHUNK_COUNT; i++) {
                    const start = i * THREAD_CHUNK_COUNT;
                    const end = Math.min((i + 1) * THREAD_CHUNK_COUNT, CHUNK_COUNT);

                    const worker = new Worker('./worker.js', { type: 'module' });
                    worker.postMessage({ file, start, end, CHUNK_SIZE });

                    worker.onmessage = function (e) {
                        result[i] = e.data;
                        worker.terminate();
                        finishCount++;
                        if (finishCount === THREAD_COUNT) {
                            resolve(result.flat());
                        }
                    };
                }
            });
        }
    </script>
</body>

</html>
